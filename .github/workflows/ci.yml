name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Wails needs webkit2gtk headers to compile on Linux. The frontend must
      # be built before any Go command runs: main.go embeds frontend/dist via
      # `//go:embed all:frontend/dist`, and go vet/test/build fail with
      # "pattern all:frontend/dist: no matching files found" otherwise.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        shell: bash
        # Requires frontend/package-lock.json to be committed (it is).
        run: npm ci --prefix frontend

      - name: Build frontend
        shell: bash
        run: npm run build --prefix frontend

      - name: Go vet
        shell: bash
        run: go vet ./...

      - name: Go test
        shell: bash
        run: go test ./... -short

      - name: Check gofmt formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
